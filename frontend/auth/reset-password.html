<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Cemetery Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/typography.css">
    <link rel="stylesheet" href="../../assets/css/spacing.css">
    <link rel="stylesheet" href="../../assets/css/shadows.css">
    <link rel="stylesheet" href="../../assets/css/animations.css">
    <link rel="stylesheet" href="../../assets/css/shared/base.css">
    <link rel="stylesheet" href="../../assets/css/components/buttons.css">
    <link rel="stylesheet" href="../../assets/css/auth/reset-flow.css">
</head>
<body>

    <div class="bg-overlay"></div>

    <div class="reset-container">
        <div class="reset-card">
            <div class="step-indicator">
                <span class="step-indicator__dot is-done"></span>
                <span class="step-indicator__dot is-done"></span>
                <span class="step-indicator__dot is-active"></span>
            </div>

            <div class="reset-icon"><i class="fas fa-lock-open"></i></div>

            <div class="reset-header">
                <h1>Reset Password</h1>
                <p class="reset-subtitle">Create a new password for your account.</p>
            </div>

            <div id="alert" class="alert" role="alert" aria-live="polite"></div>

            <form id="resetPasswordForm" action="javascript:void(0);">
                <div class="input-field">
                    <label for="password">New Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-lock"></i></span>
                        <input type="password" id="password" placeholder="Enter new password" required aria-describedby="passwordError">
                        <button type="button" class="toggle-password" data-target="password" onclick="togglePassword('password')" aria-label="Show password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="error-message" id="passwordError" role="alert"></div>
                </div>

                <div class="input-field">
                    <label for="confirm_password">Confirm New Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-shield-alt"></i></span>
                        <input type="password" id="confirm_password" placeholder="Confirm new password" required aria-describedby="confirmError">
                        <button type="button" class="toggle-password" data-target="confirm_password" onclick="togglePassword('confirm_password')" aria-label="Show password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="error-message" id="confirmError" role="alert"></div>
                </div>

                <button type="submit" class="btn-primary-action" id="submitBtn">
                    <span>Reset Password</span>
                    <i class="fas fa-check"></i>
                </button>
            </form>

            <div class="reset-links">
                <p>Back to <a href="login.html">sign in</a></p>
            </div>

            <div class="footer-text">
                <p>© 2026 Cemetery Management System. All rights reserved.</p>
            </div>
        </div>
    </div>

    <script src="../../assets/js/shared/api.js"></script>
    <script src="../../assets/js/shared/button-loading.js"></script>
    <script src="../../assets/js/auth/reset-password.js"></script>
    <script>
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const btn = document.querySelector(`.toggle-password[data-target="${fieldId}"]`);
            const icon = btn ? btn.querySelector('i') : null;
            if (!field) return;
            if (field.type === 'password') {
                field.type = 'text';
                if (icon) {
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                }
                if (btn) btn.setAttribute('aria-label', 'Hide password');
            } else {
                field.type = 'password';
                if (icon) {
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
                if (btn) btn.setAttribute('aria-label', 'Show password');
            }
        }
    </script>
</body>
</html>
