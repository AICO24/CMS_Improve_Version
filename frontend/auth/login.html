<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cemetery Management System | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/typography.css">
    <link rel="stylesheet" href="../../assets/css/spacing.css">
    <link rel="stylesheet" href="../../assets/css/shadows.css">
    <link rel="stylesheet" href="../../assets/css/animations.css">
    <link rel="stylesheet" href="../../assets/css/shared/base.css">
    <link rel="stylesheet" href="../../assets/css/components/buttons.css">
    <link rel="stylesheet" href="../../assets/css/auth/login.css">
    <script src="https://cdn.lordicon.com/lordicon.js"></script>
</head>
<body>

    <div class="bg-overlay"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="card-accent"></div>
            <div class="corner-decoration corner-tl"></div>
            <div class="corner-decoration corner-tr"></div>
            <div class="corner-decoration corner-bl"></div>
            <div class="corner-decoration corner-br"></div>

            <div class="logo">
                <div class="logo-icon-wrapper">
                    <lord-icon
                        src="https://cdn.lordicon.com/iuteewri.json"
                        trigger="hover"
                        colors="primary:#2c5e47,secondary:#7aa77a"
                        style="width:70px;height:70px;">
                    </lord-icon>
                </div>
                <h1>Cemetery Management System</h1>
                <p>Intelligent Burial Slot Scheduling with AI</p>
                <div class="divider">
                    <span></span>
                    <i class="fas fa-leaf"></i>
                    <span></span>
                </div>
                <p class="sub-text">Sign in to access the system</p>
            </div>

            <div id="alert" class="alert" role="alert" aria-live="polite"></div>

            <form id="loginForm" action="javascript:void(0);">
                <!-- Username -->
                <div class="input-field">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-user"></i></span>
                        <input type="text" id="username" placeholder="Enter your username or email" autocomplete="username" required aria-describedby="usernameError">
                    </div>
                    <div class="error-message" id="usernameError" role="alert"></div>
                </div>

                <!-- Password -->
                <div class="input-field">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-lock"></i></span>
                        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required aria-describedby="passwordError">
                        <button type="button" class="toggle-password" data-target="password" onclick="togglePassword('password')" aria-label="Show password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="error-message" id="passwordError" role="alert"></div>
                </div>

                <!-- Role -->
                <div class="input-field">
                    <label for="role">Role</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-user-tag"></i></span>
                        <select id="role" required>
                            <option value="user">User</option>
                            <option value="staff">Staff</option>
                            <option value="admin">Administrator</option>
                        </select>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span class="checkmark"></span>
                        Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn-signin">
                    <span>Sign In</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="register-link">
                <p>Don't have an account? <a href="register.html">Register new account</a></p>
            </div>

            <div class="footer-text">
                <p>© 2026 Cemetery Management System. All rights reserved.</p>
            </div>
        </div>
    </div>
    
    <script src="../../assets/js/shared/api.js"></script>
    <script src="../../assets/js/shared/button-loading.js"></script>
    <script src="../../assets/js/auth/login.js"></script>
    <script>
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const btn = document.querySelector(`.toggle-password[data-target="${fieldId}"]`);
            const icon = btn ? btn.querySelector('i') : null;
            if (!field) return;
            if (field.type === 'password') {
                field.type = 'text';
                if (icon) {
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                }
                if (btn) btn.setAttribute('aria-label', 'Hide password');
            } else {
                field.type = 'password';
                if (icon) {
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
                if (btn) btn.setAttribute('aria-label', 'Show password');
            }
        }
    </script>
</body>
</html>
