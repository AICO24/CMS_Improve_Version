<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Cemetery Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/typography.css">
    <link rel="stylesheet" href="../../assets/css/spacing.css">
    <link rel="stylesheet" href="../../assets/css/shadows.css">
    <link rel="stylesheet" href="../../assets/css/animations.css">
    <link rel="stylesheet" href="../../assets/css/shared/base.css">
    <link rel="stylesheet" href="../../assets/css/components/buttons.css">
    <link rel="stylesheet" href="../../assets/css/auth/register.css">
    <script src="https://cdn.lordicon.com/lordicon.js"></script>
</head>
<body>

    <div class="bg-overlay"></div>

    <div class="register-shell">
        <div class="register-panel register-panel--visual">
            <img class="register-panel__photo" src="../../assets/images/Auth.jpg" alt="Cemetery grounds">
            <div class="register-panel__scrim"></div>
            <div class="register-panel__content">
                <div class="register-panel__icon">
                    <lord-icon
                        src="https://cdn.lordicon.com/hhxmdqos.json"
                        trigger="loop"
                        delay="2000"
                        colors="primary:#ffffff,secondary:#7aa77a"
                        style="width:60px;height:60px;">
                    </lord-icon>
                </div>
                <h1>Create Account</h1>
                <div class="divider divider--light">
                    <span></span>
                    <i class="fas fa-leaf"></i>
                    <span></span>
                </div>
                <p>Register as a citizen user to reserve burial slots, track payments, and manage your records.</p>
            </div>
        </div>

        <div class="register-panel register-panel--form">
            <div class="register-form-inner">
                <div class="register-form-header">
                    <h2>Register a New Account</h2>
                    <p class="register-subtitle">Complete the form below to create your account</p>
                </div>

                <div id="alert" class="alert" role="alert" aria-live="polite"></div>

                <form id="registerForm" action="javascript:void(0);">
                    <div class="form-grid">
                        <!-- Full Name -->
                        <div class="input-field">
                            <label for="full_name">Full Name</label>
                            <div class="input-wrapper">
                                <span class="input-icon"><i class="fas fa-user"></i></span>
                                <input type="text" id="full_name" placeholder="Enter full name" required aria-describedby="fullNameError">
                            </div>
                            <div class="error-message" id="fullNameError" role="alert"></div>
                        </div>

                        <!-- Email -->
                        <div class="input-field">
                            <label for="email">Email Address</label>
                            <div class="input-wrapper">
                                <span class="input-icon"><i class="fas fa-envelope"></i></span>
                                <input type="email" id="email" placeholder="Enter email address" required aria-describedby="emailError">
                            </div>
                            <div class="error-message" id="emailError" role="alert"></div>
                        </div>

                        <!-- Username (optional) -->
                        <div class="input-field">
                            <label for="username">Username <span class="label-hint">(optional)</span></label>
                            <div class="input-wrapper">
                                <span class="input-icon"><i class="fas fa-user-circle"></i></span>
                                <input type="text" id="username" placeholder="Choose a username" aria-describedby="usernameError">
                            </div>
                            <div class="error-message" id="usernameError" role="alert"></div>
                        </div>

                        <!-- Contact Number -->
                        <div class="input-field">
                            <label for="contact_number">Contact Number</label>
                            <div class="input-wrapper">
                                <span class="input-icon"><i class="fas fa-phone"></i></span>
                                <input type="text" id="contact_number" placeholder="Enter contact number" aria-describedby="contactError">
                            </div>
                            <div class="error-message" id="contactError" role="alert"></div>
                        </div>

                        <!-- Address (full width) -->
                        <div class="input-field input-field--full">
                            <label for="address">Address</label>
                            <div class="input-wrapper">
                                <span class="input-icon"><i class="fas fa-map-marker-alt"></i></span>
                                <input type="text" id="address" placeholder="Enter address" aria-describedby="addressError">
                            </div>
                            <div class="error-message" id="addressError" role="alert"></div>
                        </div>

                        <!-- Password -->
                        <div class="input-field">
                            <label for="password">Password</label>
                            <div class="input-wrapper">
                                <span class="input-icon"><i class="fas fa-lock"></i></span>
                                <input type="password" id="password" placeholder="Create a password" required aria-describedby="passwordError">
                                <button type="button" class="toggle-password" data-target="password" onclick="togglePassword('password')" aria-label="Show password">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <div class="error-message" id="passwordError" role="alert"></div>
                        </div>

                        <!-- Confirm Password -->
                        <div class="input-field">
                            <label for="confirm_password">Confirm Password</label>
                            <div class="input-wrapper">
                                <span class="input-icon"><i class="fas fa-shield-alt"></i></span>
                                <input type="password" id="confirm_password" placeholder="Confirm your password" required aria-describedby="confirmError">
                                <button type="button" class="toggle-password" data-target="confirm_password" onclick="togglePassword('confirm_password')" aria-label="Show password">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <div class="error-message" id="confirmError" role="alert"></div>
                        </div>
                    </div>

                    <button type="submit" class="btn-register">
                        <span>Register Account</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </form>

                <div class="auth-divider"><span></span><span>or</span><span></span></div>

                <a href="login.html" class="btn-sign-in-instead">
                    <i class="fas fa-arrow-right-to-bracket"></i>
                    <span>Already have an account? Sign in</span>
                </a>

                <div class="footer-text">
                    <p>© 2026 Cemetery Management System. All rights reserved.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="../../assets/js/shared/api.js"></script>
    <script src="../../assets/js/shared/button-loading.js"></script>
    <script src="../../assets/js/auth/register.js"></script>
    <script>
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const btn = document.querySelector(`.toggle-password[data-target="${fieldId}"]`);
            const icon = btn ? btn.querySelector('i') : null;
            if (!field) return;
            if (field.type === 'password') {
                field.type = 'text';
                if (icon) {
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                }
                if (btn) btn.setAttribute('aria-label', 'Hide password');
            } else {
                field.type = 'password';
                if (icon) {
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
                if (btn) btn.setAttribute('aria-label', 'Show password');
            }
        }
    </script>
</body>
</html>
