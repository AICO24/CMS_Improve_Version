<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reservations | Cemetery Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/typography.css">
    <link rel="stylesheet" href="../../assets/css/spacing.css">
    <link rel="stylesheet" href="../../assets/css/shadows.css">
    <link rel="stylesheet" href="../../assets/css/animations.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/dashboard.css">
    <link rel="stylesheet" href="../../assets/css/components/buttons.css">
    <link rel="stylesheet" href="../../assets/css/components/cards.css">
    <link rel="stylesheet" href="../../assets/css/components/forms.css">
    <link rel="stylesheet" href="../../assets/css/components/tables.css">
    <link rel="stylesheet" href="../../assets/css/components/modals.css">
    <link rel="stylesheet" href="../../assets/css/dashboard_user.css">
    <link rel="stylesheet" href="../../assets/css/user-management.css">
    <link rel="stylesheet" href="../../assets/css/components/search-input.css">
    <style>
        /* Toolbar/pagination layout (toolbar-action-row, status-select-field,
           active-filter-chips, pagination-actions/jump) now come from the
           shared user-management.css this page already loads — only the
           status-badge palette stays page-local since it's specific to
           reservation statuses, not user accounts. */
        .status-badge.pending {
            background: #f7f0ff;
            color: #6d3d9d;
        }
        .status-badge.confirmed {
            background: #e6f8ef;
            color: #147046;
        }
        .status-badge.cancelled {
            background: #fff1f2;
            color: #9e1a24;
        }
        .status-badge.completed {
            background: #e8f5ff;
            color: #1d4ed8;
        }
    </style>
</head>
<body class="dashboard-body">
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand"><i class="fas fa-tree"></i> <span>Cemetery Management</span></div>
            </div>
            <div class="sidebar-nav">
                <a href="dashboard_user.html" class="nav-item"><i class="fas fa-gauge-high icon"></i> <span>Dashboard</span></a>
                <a href="reserve-burial-slot.html" class="nav-item"><i class="fas fa-monument icon"></i> <span>Reserve Burial Slot</span></a>
                <a href="my-reservations.html" class="nav-item active"><i class="fas fa-bookmark icon"></i> <span>My Reservations</span></a>
                <a href="payments.html" class="nav-item"><i class="fas fa-credit-card icon"></i> <span>Payments</span></a>
                <a href="payment-history.html" class="nav-item"><i class="fas fa-receipt icon"></i> <span>Payment History</span></a>
                <a href="my-records.html" class="nav-item"><i class="fas fa-folder-open icon"></i> <span>My Records</span></a>
                <a href="notifications.html" class="nav-item"><i class="fas fa-bell icon"></i> <span>Notifications</span></a>
                <a href="profile.html" class="nav-item"><i class="fas fa-id-card icon"></i> <span>Profile</span></a>
                <a href="settings.html" class="nav-item"><i class="fas fa-gear icon"></i> <span>Settings</span></a>
            </div>
            <div class="sidebar-footer">
                <div class="user-chip">
                    <i class="fas fa-user-circle"></i>
                    <div><span id="sidebarUserName">Client</span><small id="sidebarUserRole">User</small></div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="top-bar">
                <div class="top-left">
                    <label class="hamburger">
                        <input type="checkbox" id="toggleSidebar">
                        <svg viewBox="0 0 32 32">
                            <path class="line line-top-bottom" d="M27 10H13c-2.209 0-4-1.791-4-4 0-2.209 1.791-4 4-4 2.209 0 4 1.791 4 4v20 c0 2.209-1.791 4-4 4 -2.209 0-4-1.791-4-4 0-2.209 1.791-4 4-4h14"></path>
                            <path class="line" d="M7 16H27"></path>
                        </svg>
                    </label>
                    <h3 id="pageTitle">My Reservations</h3>
                </div>
                <div class="user-info">
                    <div class="notification-icon" id="notificationIcon">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge" id="notificationBadge">0</span>
                    </div>
                    <div class="profile">
                        <div class="profile-avatar" id="userAvatar"><i class="fas fa-user"></i></div>
                        <div class="profile-text">
                            <div class="user-name" id="userName">Client</div>
                            <div class="user-role" id="userRole">User</div>
                        </div>
                    </div>
                    <button class="Btn logout-btn" id="logoutBtn">
                        <div class="sign"><i class="fas fa-sign-out-alt"></i></div>
                        <div class="text">Logout</div>
                    </button>
                </div>
            </div>

            <div class="content-area">
                <div class="card">
                    <div class="toolbar-row">
                        <div class="toolbar-action-row">
                            <div class="toolbar-section-label">
                                <i class="fas fa-filter"></i>
                                <span>Filters</span>
                            </div>
                        </div>
                        <div class="toolbar-main-row">
                            <div class="toolbar-filters">
                                <div class="search-field">
                                    <input type="text" id="searchQuery" class="search-field__input" placeholder=" ">
                                    <label for="searchQuery" class="search-field__label">Search by lot, section or decedent</label>
                                    <span class="search-field__icon" aria-hidden="true">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M10.979 16.8991C11.0591 17.4633 10.6657 17.9926 10.0959 17.9994C8.52021 18.0183 6.96549 17.5712 5.63246 16.7026C4.00976 15.6452 2.82575 14.035 2.30018 12.1709C1.77461 10.3068 1.94315 8.31525 2.77453 6.56596C3.60592 4.81667 5.04368 3.42838 6.82101 2.65875C8.59833 1.88911 10.5945 1.79039 12.4391 2.3809C14.2837 2.97141 15.8514 4.21105 16.8514 5.86977C17.8513 7.52849 18.2155 9.49365 17.8764 11.4005C17.5979 12.967 16.8603 14.4068 15.7684 15.543C15.3736 15.9539 14.7184 15.8787 14.3617 15.4343C14.0051 14.9899 14.0846 14.3455 14.4606 13.9173C15.1719 13.1073 15.6538 12.1134 15.8448 11.0393C16.0964 9.62426 15.8261 8.166 15.0841 6.93513C14.3421 5.70426 13.1788 4.78438 11.81 4.34618C10.4412 3.90799 8.95988 3.98125 7.641 4.55236C6.32213 5.12348 5.25522 6.15367 4.63828 7.45174C4.02135 8.74982 3.89628 10.2276 4.28629 11.6109C4.67629 12.9942 5.55489 14.1891 6.75903 14.9737C7.67308 15.5693 8.72759 15.8979 9.80504 15.9333C10.3746 15.952 10.8989 16.3349 10.979 16.8991Z"></path><rect transform="rotate(-49.6812 12.2469 14.8859)" rx="1" height="10.1881" width="2" y="14.8859" x="12.2469"></rect></svg>
                                    </span>
                                </div>
                                <label class="status-select-field" for="statusFilter">
                                    <span>Status</span>
                                    <select id="statusFilter" aria-label="Filter by status">
                                    <option value="">All statuses</option>
                                    <option value="Pending">Pending</option>
                                    <option value="Confirmed">Confirmed</option>
                                    <option value="Completed">Completed</option>
                                    <option value="Cancelled">Cancelled</option>
                                    </select>
                                </label>
                                <button class="btn-secondary" id="clearFilters">Clear</button>
                            </div>
                        </div>
                    </div>

                    <div class="active-filter-chips" id="activeFilterChips" aria-live="polite"></div>

                    <div class="table-container">
                        <table class="data-table" id="reservationsTable">
                            <thead>
                                <tr>
                                    <th>Reservation</th>
                                    <th>Lot</th>
                                    <th>Section</th>
                                    <th>Burial Date</th>
                                    <th>Status</th>
                                    <th>Decedent</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="reservationsBody">
                                <tr><td colspan="7">Loading reservations...</td></tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="pagination-controls" id="paginationControls">
                        <span class="pagination-info" id="paginationInfo"></span>
                        <div class="pagination-actions">
                            <form class="pagination-jump" id="paginationJumpForm">
                                <label for="pageJumpInput">Jump to page</label>
                                <input type="number" id="pageJumpInput" min="1" step="1" placeholder="Enter page number">
                                <button class="btn-secondary" id="pageJumpBtn" type="submit"><i class="fas fa-arrow-right-to-bracket"></i><span>Go</span></button>
                            </form>
                            <span class="pagination-divider" aria-hidden="true"></span>
                            <button class="btn-secondary" id="prevPage"><i class="fas fa-chevron-left"></i><span>Previous</span></button>
                            <button class="btn-secondary" id="nextPage"><span>Next</span><i class="fas fa-chevron-right"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../assets/js/shared/api.js"></script>
    <script src="../../assets/js/shared/button-loading.js"></script>
    <script src="../../assets/js/shared/pagination.js"></script>
    <script src="../../assets/js/pages/my-reservations.js"></script>
</body>
</html>
