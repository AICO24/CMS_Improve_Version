<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=booking-assistant.html?service=burial">
    <title>Redirecting to Booking Assistant | Cemetery Management System</title>
    <link rel="canonical" href="booking-assistant.html?service=burial">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <script>
        // Legacy Burial Scheduling Redirect -> Unified Booking Assistant
        (function() {
            var search = window.location.search;
            var target = 'booking-assistant.html?service=burial';
            if (search) {
                var params = new URLSearchParams(search);
                params.delete('service');
                var remaining = params.toString();
                if (remaining) target += '&' + remaining;
            }
            window.location.replace(target);
        })();
    </script>
</head>
<body style="font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f8fafc; color: #1e293b; padding: 20px;">
    <div style="max-width: 520px; width: 100%; text-align: center; padding: 32px; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #e2e8f0;">
        <h2 style="margin-top: 0; margin-bottom: 12px; font-size: 1.4rem; color: #0f172a;">Redirecting to Unified Booking Assistant</h2>
        <p style="font-size: 0.95rem; color: #64748b; line-height: 1.5; margin-bottom: 20px;">
            Burial scheduling has been consolidated into the <strong>Unified Booking Assistant</strong>. You are being redirected automatically.
        </p>
        <p style="font-size: 0.9rem; color: #64748b; margin: 0;">
            If you are not redirected automatically, <a href="booking-assistant.html?service=burial" style="color: #2563eb; font-weight: 600; text-decoration: underline;">click here to continue to Booking Assistant</a>.
        </p>
    </div>
    <script src="../../assets/js/shared/navigation-config.js"></script>
    <script src="../../assets/js/shared/api.js"></script>
    <script src="../../assets/js/pages/burial-scheduling.js"></script>
</body>
</html>
