    <script>
        // Legacy Citizen Cremation Intake Redirect -> Unified Booking Assistant (Batch B)
        (function() {
            var search = window.location.search;
            var target = 'booking-assistant.html?service=cremation';
            if (search) {
                var params = new URLSearchParams(search);
                params.delete('service');
                var remaining = params.toString();

            }
            window.location.replace(target);
        })();
    </script>
