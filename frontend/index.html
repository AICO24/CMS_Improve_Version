    <!-- Early theme initialization to eliminate flash of light/dark mode -->
    <script>
        (function() {
            try {
                var theme = localStorage.getItem('cms-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
                document.addEventListener('DOMContentLoaded', function() {
                    document.body.setAttribute('data-theme', theme);
                });
            } catch (e) {}
        })();
    </script>
